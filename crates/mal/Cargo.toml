[package]
name = "mal"
description = "REPL and comparison runner for Make-a-Lisp implementations in Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "mal"
path = "src/main.rs"

[dependencies]
mal-traits = { path = "../mal-traits" }

# Benchmarks only. Dev-dependencies never reach the `mal` binary, so the size
# and build-time columns are unaffected.
[dev-dependencies]
mal-bench = { path = "../mal-bench" }
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "components"
harness = false

[lints]
workspace = true
