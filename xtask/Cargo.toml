[package]
name = "xtask"
description = "Repository tasks: record benchmark runs under runs/ and render them into the documentation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# The registry: the results page lists every registered implementation,
# measured or not, so the tables cannot drift from what is built.
mal = { path = "../crates/mal" }
mal-traits = { path = "../crates/mal-traits" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
